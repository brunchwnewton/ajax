<style>
:root {
  /* Light mode defaults */
  --music-text-strong: #1a1a2e;
  --music-text: #2d2d44;
  --music-text-mid: #5a5a7a;
  --music-text-dim: #888899;
  --music-text-faint: #aaaabb;
  --music-link: #4a3fcc;
  --music-border: rgba(74,63,204,0.18);
  --music-border-faint: rgba(74,63,204,0.10);
  --music-rule: rgba(0,0,0,0.08);
  --music-audio-filter: none;
}
@media (prefers-color-scheme: dark) {

    --music-text-strong: #f0f0ff;
    --music-text: #d4d4e8;
    --music-text-mid: #8888aa;
    --music-text-dim: #7777aa;
    --music-text-faint: #555570;
    --music-link: #6e5cff;
    --music-border: rgba(110,92,255,0.18);
    --music-border-faint: rgba(110,92,255,0.12);
    --music-rule: rgba(200,200,222,0.06);
    --music-audio-filter: invert(0.85) hue-rotate(200deg) saturate(0.3);

}
.music-wrap {
  max-width: 680px;
  margin: 0 auto;
  padding: 5.5rem 2rem 4rem;
}
.music-wrap h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.8rem, 4vw, 2.5rem);
  font-weight: 300;
  color: var(--music-text-strong);
  text-align: center;
  margin-bottom: 0.3rem;
}
.music-intro {
  text-align: center;
  color: var(--music-text-mid);
  font-size: 0.88rem;
  max-width: 480px;
  margin: 0 auto 2rem;
  line-height: 1.55;
}
.month-header {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.2rem;
  font-weight: 400;

  margin: 2.2rem 0 0.6rem;
  padding-bottom: 0.35rem;
  border-bottom: 1px solid var(--music-border-faint);
}
.month-header:first-of-type { margin-top: 0; }
.track-list { display: flex; flex-direction: column; }
.track {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  padding: 0.7rem 0;
  border-bottom: 1px solid var(--music-rule);
}
.track:last-child { border-bottom: none; }
.track-num {
  font-family: 'Fira Code', monospace;
  font-size: 0.72rem;
  color: var(--music-text-faint);
  min-width: 1.5rem;
  text-align: right;
  flex-shrink: 0;
}
.track-info { flex: 1; min-width: 0; }
.track-title-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.8rem;
}
.track-title {
  font-size: 0.9rem;
  color: var(--music-text);
  font-weight: 400;
  flex: 1;
  min-width: 0;
}
.track-sub {
  font-size: 0.75rem;
  color: var(--music-text-dim);
  margin-top: 0.05rem;
}
.track-date {
  font-size: 0.7rem;
  color: var(--music-text-faint);
  font-family: 'Fira Code', monospace;
  flex-shrink: 0;
  white-space: nowrap;
}
.track audio {
  width: 100%;
  height: 32px;
  margin-top: 0.4rem;
  opacity: 0.8;
  filter: var(--music-audio-filter);
}
.track audio:hover { opacity: 1; }
.music-loading {
  font-size: 0.85rem;
  color: var(--music-text-faint);
  font-style: italic;
  text-align: center;
  padding: 2rem 0;
}
.track-count {
  text-align: center;
  font-size: 0.75rem;
  color: var(--music-text-faint);
  margin-bottom: 1.5rem;
}
.music-footer {
  text-align: center;
  margin-top: 3rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--music-rule);

  color: var(--music-text-faint);
}
.music-footer a {
  color: var(--music-link);
  text-decoration: none;

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

<script>
/* ============================================================

   (title, composer, date, ordering) is automatic.
   ============================================================ */
var BASE = '/ajax/files/songs/';

var FILES = [
  'Dark Flames\' Theme Song.mp3',

  'BG Music 1 - Underwater Muffle.mp3',
  'Trailer End 2.mp3',
  'IMG_9320.mp3',
  'IMG_9326.mp3'
];

var MONTHS = ['January','February','March','April','May','June',
              'July','August','September','October','November','December'];

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise(function(resolve) { setTimeout(function() { resolve(null); }, ms); })
  ]);
}

function readTags(url) {
  if (/\.wav($|\?)/i.test(url)) {
    return Promise.resolve({ tags: null, reason: 'wav-skipped' });
  }
  if (typeof jsmediatags === 'undefined') {
    return Promise.resolve({ tags: null, reason: 'jsmediatags-not-loaded' });
  }
  /* jsmediatags's URL pattern check rejects site-root-relative paths like
     "/ajax/files/songs/foo.mp3" — it requires a fully-qualified URL with
     scheme. Promote relative URLs to absolute against the current origin. */
  var absoluteUrl = url;
  if (url.indexOf('://') === -1) {
    absoluteUrl = window.location.origin + (url.charAt(0) === '/' ? '' : '/') + url;
  }
  var p = new Promise(function(resolve) {
    try {
      jsmediatags.read(absoluteUrl, {
        onSuccess: function(tag) {
          resolve({ tags: tag.tags || null, reason: 'success' });
        },
        onError: function(err) {
          resolve({ tags: null, reason: 'jsmediatags-error', error: err });
        }
      });
    } catch (e) {
      resolve({ tags: null, reason: 'jsmediatags-threw', error: e });
    }
  });
  return withTimeout(p, 30000).then(function(result) {
    return result || { tags: null, reason: 'timeout' };
  });
}

function fetchDate(url) {
  var p = fetch(url, { method: 'HEAD' })
    .then(function(res) {
      var lm = res.headers.get('last-modified');
      return lm ? new Date(lm) : null;
    })
    .catch(function() { return null; });
  return withTimeout(p, 15000);
}

/* Pull a date out of jsmediatags output. Handles the many shapes ID3
   frames can take across versions and writer software. Returns a Date
   or null. Falls back to serverDate only as a last resort. */
function extractDate(tags, serverDate) {
  if (!tags) return serverDate;

  /* Helper to walk down jsmediatags's various wrapper shapes to a primitive. */
  function unwrap(raw) {
    if (raw == null) return null;
    var val = raw;
    if (typeof val === 'object') {
      if (val.data != null) val = val.data;
      if (val && typeof val === 'object' && val.text != null) val = val.text;
    }
    return (val == null || val === '') ? null : val;
  }

  /* ID3v2.3-style date: TYER (year) + TDAT (DDMM) + TIME (HHMM). When all
     three are present, combine into a real timestamp. This is what older
     Audition versions write. Check this first because it's the most
     specific pattern; if it matches, the result is more accurate than
     anything the candidate loop below would produce. */
  var tyer = unwrap(tags.TYER);
  if (tyer) {
    var year = parseInt(String(tyer).match(/\d{4}/) ? String(tyer).match(/\d{4}/)[0] : 'X', 10);
    if (!isNaN(year) && year > 1900 && year < 2100) {
      var tdat = unwrap(tags.TDAT);  /* DDMM */
      var time = unwrap(tags.TIME);  /* HHMM */
      var month = 0, day = 1, hour = 12, minute = 0;
      if (tdat && /^\d{4}$/.test(String(tdat))) {
        day = parseInt(String(tdat).slice(0, 2), 10);
        month = parseInt(String(tdat).slice(2, 4), 10) - 1;
      }
      if (time && /^\d{4}$/.test(String(time))) {
        hour = parseInt(String(time).slice(0, 2), 10);
        minute = parseInt(String(time).slice(2, 4), 10);
      }
      var combined = new Date(year, month, day, hour, minute);
      if (!isNaN(combined.getTime())) return combined;
    }
  }

  /* All the field names known to carry a date or year, in priority order.
     ID3v2.4 prefers TDRC; v2.3 used TYER+TDAT (handled above); some
     writers use TORY, TDOR, recordingTime, originalReleaseTime, etc. */
  var candidates = [
    tags.TDRC, tags.TDOR, tags.TDRL, tags.TDEN,
    tags.TORY, tags.recordingTime,
    tags.originalReleaseTime, tags.releaseTime,
    tags.date, tags.year
  ];

  for (var i = 0; i < candidates.length; i++) {
    var val = unwrap(candidates[i]);
    if (val == null) continue;

    /* Try parsing as a Date directly first — handles ISO 8601, US-style
       "4/22/2022 4:49:25 PM", etc. */
    var d = new Date(val);
    if (!isNaN(d.getTime()) && d.getFullYear() > 1900 && d.getFullYear() < 2100) {
      return d;
    }

    /* Fallback: extract a 4-digit year from anywhere in the string. */
    var m = String(val).match(/(19|20)\d{2}/);
    if (m) {
      var y = parseInt(m[0], 10);
      if (!isNaN(y)) return new Date(y, 0, 1);
    }
  }

  return serverDate;
}

/* One-time debug helper: log the result of the first track's metadata
   read, even when it failed. This always fires on first call so we always
   know whether tag-reading is working at all on the deployed site.
   Set DEBUG_TAGS to false once dates are confirmed working. */
var DEBUG_TAGS = true;
var debugTagsLogged = false;
function maybeLogTags(filename, tagsResult, serverDate) {
  if (!DEBUG_TAGS || debugTagsLogged) return;
  debugTagsLogged = true;
  console.log('[music] === First-track diagnostic ===');
  console.log('[music] filename:', filename);
  console.log('[music] readTags reason:', tagsResult ? tagsResult.reason : '(none)');
  if (tagsResult && tagsResult.error) {
    console.log('[music] readTags error:', tagsResult.error);
  }
  console.log('[music] jsmediatags loaded:', typeof jsmediatags !== 'undefined');
  console.log('[music] server last-modified:', serverDate);

  var tags = tagsResult && tagsResult.tags;
  if (tags) {
    console.log('[music] tag object:', tags);
    console.log('[music] tag keys:', Object.keys(tags));
    var dateLikeKeys = Object.keys(tags).filter(function(k) {
      return /^T(D|Y|OR)|date|year|time/i.test(k);
    });
    console.log('[music] date-related keys:', dateLikeKeys);
    dateLikeKeys.forEach(function(k) {
      console.log('[music]   ' + k + ' =', tags[k]);
    });
  } else {
    console.log('[music] no tag object returned -- see reason above');
  }
  console.log('[music] === End diagnostic ===');
}

function prettify(filename) {
  return filename.replace(/\.[^.]+$/, '').replace(/_/g, ' ');
}

function fmtDay(d) {
  if (!d || isNaN(d.getTime())) return '';
  return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}

function monthKey(d) {
  if (!d || isNaN(d.getTime())) return 'Unknown Date';
  return MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}

function buildTrack(num, url, filename, tags, date) {
  var title = (tags && tags.title) ? tags.title : prettify(filename);
  var sub = '';
  if (tags) {
    var composer = tags.composer || '';
    var artist = tags.artist || '';
    if (composer && artist && composer !== artist) {
      sub = composer + ' \u00b7 ' + artist;
    } else {
      sub = composer || artist || '';
    }
    if (tags.album) sub += (sub ? ' \u00b7 ' : '') + tags.album;
  }
  var ds = fmtDay(date);
  var ext = filename.split('.').pop().toLowerCase();
  var mime = ext === 'wav' ? 'audio/wav' : 'audio/mpeg';

  var el = document.createElement('div');
  el.className = 'track';
  el.innerHTML =
    '<span class="track-num">' + num + '</span>' +
    '<div class="track-info">' +
      '<div class="track-title">' + title + '</div>' +
      (sub ? '<div class="track-sub">' + sub + '</div>' : '') +
      (ds ? '<div class="track-date">' + ds + '</div>' : '') +
      '<audio controls preload="none">' +
        '<source src="' + url + '" type="' + mime + '">' +
      '</audio>' +
    '</div>';
  return el;
}

function renderTracks() {
  console.log('[music] renderTracks() starting; ' + FILES.length + ' files; jsmediatags loaded:', typeof jsmediatags !== 'undefined');
  var container = document.getElementById('track-container');
  if (!container) {
    console.error('[music] track-container not found in DOM');
    return;
  }

  /* Render the basic list IMMEDIATELY using just filenames.
     Metadata (ID3 tags, server dates) will populate asynchronously after.
     This guarantees tracks always show up, even if every metadata request fails. */
  function renderImmediate() {
    container.innerHTML = '';
    var countEl = document.createElement('div');
    countEl.className = 'track-count';
    countEl.textContent = FILES.length + ' tracks';
    container.appendChild(countEl);

    var listEl = document.createElement('div');
    listEl.className = 'track-list';
    container.appendChild(listEl);

    FILES.forEach(function(filename, i) {
      var url = BASE + encodeURIComponent(filename);
      var ext = filename.split('.').pop().toLowerCase();
      var mime = ext === 'wav' ? 'audio/wav' : 'audio/mpeg';
      var title = prettify(filename);

      var el = document.createElement('div');
      el.className = 'track';
      el.setAttribute('data-filename', filename);
      el.innerHTML =
        '<span class="track-num">' + (i + 1) + '</span>' +
        '<div class="track-info">' +
          '<div class="track-title-row">' +
            '<div class="track-title">' + title + '</div>' +
            '<div class="track-date track-date-meta">&mdash;</div>' +
          '</div>' +
          '<div class="track-sub track-sub-meta"></div>' +
          '<audio controls preload="none">' +
            '<source src="' + url + '" type="' + mime + '">' +
          '</audio>' +
        '</div>';
      listEl.appendChild(el);
    });
  }

  /* Try to enrich each track with ID3 tags and server dates. If a request
     fails or hangs, the track simply keeps the filename-derived defaults.
     Once all enrichment finishes, re-sort the DOM by date (newest first)
     and add month/year group headers. */
  function enrichAsync() {
    var enrichedDates = {};  /* filename -> Date or null */
    var pending = FILES.length;

    FILES.forEach(function(filename) {
      var url = BASE + encodeURIComponent(filename);
      var trackEl = container.querySelector('[data-filename="' + filename.replace(/"/g, '\\"') + '"]');
      if (!trackEl) { pending--; if (pending === 0) sortAndGroup(enrichedDates); return; }

      var subEl = trackEl.querySelector('.track-sub-meta');
      var dateEl = trackEl.querySelector('.track-date-meta');
      var titleEl = trackEl.querySelector('.track-title');

      Promise.all([readTags(url), fetchDate(url)]).then(function(r) {
        var tagsResult = r[0];  /* { tags, reason, error } */
        var serverDate = r[1];
        maybeLogTags(filename, tagsResult, serverDate);

        var tags = tagsResult ? tagsResult.tags : null;
        var date = extractDate(tags, serverDate);
        enrichedDates[filename] = date || null;

        if (tags && tags.title) titleEl.textContent = tags.title;
        if (tags) {
          var composer = tags.composer || '';
          var artist = tags.artist || '';
          var sub = '';
          if (composer && artist && composer !== artist) {
            sub = composer + ' \u00b7 ' + artist;
          } else {
            sub = composer || artist || '';
          }
          if (tags.album) sub += (sub ? ' \u00b7 ' : '') + tags.album;
          if (sub && subEl) subEl.textContent = sub;
        }
        if (date && dateEl) dateEl.textContent = fmtDay(date);
      }).catch(function(err) {
        console.warn('[music] enrichment failed for', filename, err);
        enrichedDates[filename] = null;
      }).then(function() {
        pending--;
        if (pending === 0) sortAndGroup(enrichedDates);
      });
    });
  }

  /* Re-order the rendered tracks by date (newest first) and insert
     month-group headers. Tracks with no date sink to the bottom under
     "Unknown Date". */
  function sortAndGroup(enrichedDates) {
    var listEl = container.querySelector('.track-list');
    if (!listEl) return;
    var trackEls = Array.prototype.slice.call(listEl.querySelectorAll('.track'));

    trackEls.sort(function(a, b) {
      var da = enrichedDates[a.getAttribute('data-filename')];
      var db = enrichedDates[b.getAttribute('data-filename')];
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return db.getTime() - da.getTime();
    });

    /* Wipe the list and rebuild with group headers and renumbered tracks. */
    listEl.innerHTML = '';
    var currentMonth = '';
    var num = 0;
    trackEls.forEach(function(el) {
      var d = enrichedDates[el.getAttribute('data-filename')];
      var mk = monthKey(d);
      if (mk !== currentMonth) {
        currentMonth = mk;
        var h = document.createElement('div');
        h.className = 'month-header';
        h.textContent = mk;
        listEl.appendChild(h);
        num = 0;
      }
      num++;
      var numEl = el.querySelector('.track-num');
      if (numEl) numEl.textContent = num;
      listEl.appendChild(el);
    });
  }

  try {
    renderImmediate();
    enrichAsync();
  } catch (err) {
    container.innerHTML = '<div class="music-loading" style="color:#c44;">Error rendering tracks: ' + (err && err.message ? err.message : err) + '. Check the browser console for details.</div>';
    console.error('[music] renderTracks failed:', err);
  }
}

/* Handle both cases: DOMContentLoaded already fired, or hasn't yet */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderTracks);
} else {
  renderTracks();
}
</script>
