<script>
// ──────────────────────────────────────────────
// TRACK MANIFEST
// Add or remove filenames here. Everything else
// (title, composer, date, ordering) is automatic.
// ──────────────────────────────────────────────
var BASE = '/ajax/files/songs/';

var FILES = [
  'Dark Flames\' Theme Song.mp3',
  'Dark Flames - Orchestral.mp3',
  'Dark Flames By Choir.mp3',
  'Dark Orchestra.mp3',
  'Dirty Chicago Theme.mp3',
  'Evolution in A Minor.mp3',
  'Fire and Ice.mp3',
  'Free Olympia Orchestral.mp3',
  'Hilltops in A Minor.mp3',
  'Huma.mp3',
  'Miracle Theme Orchestral.mp3',
  'Reverb.mp3',
  'Rocky Song 1.mp3',
  'Sords Theme Song.mp3',
  'The Eta Miracle.mp3',
  'The Way Things Go.mp3',
  'Song 1.mp3',
  'Song 2 - Loop.mp3',
  'Song 3 Orchestral.mp3',
  'Song 4 Orchestral.mp3',
  'Song 5.mp3',
  'Song 7.mp3',
  'Song 8 - Reverby.mp3',
  'Song 9 Orchestral - Extra Reverby.mp3',
  'Song 10 Orchestral.mp3',
  'Song 11.mp3',
  'Song 12 Orchestral.mp3',
  'Song 13.mp3',
  'Song 14 Orchestral.mp3',
  'Song 15.mp3',
  'Song 16.mp3',
  'Song 17.mp3',
  'Song 18.mp3',
  'Song 20 Orchestral.mp3',
  'Song 21.mp3',
  'Song 22.mp3',
  'Song 23.mp3',
  'Song 24.mp3',
  'BG Music 1.mp3',
  'BG Music 1 - TCDS Effect.mp3',
  'BG Music 1 - Underwater Muffle.mp3',
  'Trailer End 2.mp3'
];

var MONTHS = ['January','February','March','April','May','June',
              'July','August','September','October','November','December'];

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise(function(resolve) { setTimeout(function() { resolve(null); }, ms); })
  ]);
}

function readTags(url) {
  if (/\.wav($|\?)/i.test(url)) return Promise.resolve(null);
  if (typeof jsmediatags === 'undefined') return Promise.resolve(null);
  var p = new Promise(function(resolve) {
    try {
      jsmediatags.read(url, {
        onSuccess: function(tag) { resolve(tag.tags || null); },
        onError: function() { resolve(null); }
      });
    } catch (e) { resolve(null); }
  });
  return withTimeout(p, 4000);
}

function fetchDate(url) {
  var p = fetch(url, { method: 'HEAD' })
    .then(function(res) {
      var lm = res.headers.get('last-modified');
      return lm ? new Date(lm) : null;
    })
    .catch(function() { return null; });
  return withTimeout(p, 4000);
}

function extractDate(tags, serverDate) {
  if (tags) {
    var tdrc = tags.TDRC && tags.TDRC.data;
    if (tdrc) {
      var d = new Date(tdrc);
      if (!isNaN(d.getTime())) return d;
    }
    if (tags.year) {
      var y = parseInt(tags.year);
      if (!isNaN(y)) return new Date(y, 0, 1);
    }
  }
  return serverDate;
}

function prettify(filename) {
  return filename.replace(/\.[^.]+$/, '').replace(/_/g, ' ');
}

function fmtDay(d) {
  if (!d || isNaN(d.getTime())) return '';
  return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}

function monthKey(d) {
  if (!d || isNaN(d.getTime())) return 'Unknown Date';
  return MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}

function buildTrack(num, url, filename, tags, date) {
  var title = (tags && tags.title) ? tags.title : prettify(filename);
  var sub = '';
  if (tags) {
    var composer = tags.composer || '';
    var artist = tags.artist || '';
    if (composer && artist && composer !== artist) {
      sub = composer + ' \u00b7 ' + artist;
    } else {
      sub = composer || artist || '';
    }
    if (tags.album) sub += (sub ? ' \u00b7 ' : '') + tags.album;
  }
  var ds = fmtDay(date);
  var ext = filename.split('.').pop().toLowerCase();
  var mime = ext === 'wav' ? 'audio/wav' : 'audio/mpeg';

  var el = document.createElement('div');
  el.className = 'track';
  el.innerHTML =
    '<span class="track-num">' + num + '</span>' +
    '<div class="track-info">' +
      '<div class="track-title">' + title + '</div>' +
      (sub ? '<div class="track-sub">' + sub + '</div>' : '') +
      (ds ? '<div class="track-date">' + ds + '</div>' : '') +
      '<audio controls preload="none">' +
        '<source src="' + url + '" type="' + mime + '">' +
      '</audio>' +
    '</div>';
  return el;
}

function renderTracks() {
  var container = document.getElementById('track-container');
  if (!container) {
    console.error('[music] track-container not found in DOM');
    return;
  }

  // Render the basic list IMMEDIATELY using just filenames.
  // Metadata (ID3 tags, server dates) will populate asynchronously after.
  // This guarantees tracks always show up, even if every metadata request fails.
  function renderImmediate() {
    container.innerHTML = '';
    var countEl = document.createElement('div');
    countEl.className = 'track-count';
    countEl.textContent = FILES.length + ' tracks';
    container.appendChild(countEl);

    var listEl = document.createElement('div');
    listEl.className = 'track-list';
    container.appendChild(listEl);

    FILES.forEach(function(filename, i) {
      var url = BASE + encodeURIComponent(filename);
      var ext = filename.split('.').pop().toLowerCase();
      var mime = ext === 'wav' ? 'audio/wav' : 'audio/mpeg';
      var title = prettify(filename);

      var el = document.createElement('div');
      el.className = 'track';
      el.setAttribute('data-filename', filename);
      el.innerHTML =
        '<span class="track-num">' + (i + 1) + '</span>' +
        '<div class="track-info">' +
          '<div class="track-title">' + title + '</div>' +
          '<div class="track-sub track-sub-meta"></div>' +
          '<div class="track-date track-date-meta"></div>' +
          '<audio controls preload="none">' +
            '<source src="' + url + '" type="' + mime + '">' +
          '</audio>' +
        '</div>';
      listEl.appendChild(el);
    });
  }

  // Try to enrich each track with ID3 tags and server dates. If a request
  // fails or hangs, the track simply keeps the filename-derived defaults.
  function enrichAsync() {
    FILES.forEach(function(filename) {
      var url = BASE + encodeURIComponent(filename);
      var trackEl = container.querySelector('[data-filename="' + filename.replace(/"/g, '\\"') + '"]');
      if (!trackEl) return;

      var subEl = trackEl.querySelector('.track-sub-meta');
      var dateEl = trackEl.querySelector('.track-date-meta');
      var titleEl = trackEl.querySelector('.track-title');

      Promise.all([readTags(url), fetchDate(url)]).then(function(r) {
        var tags = r[0];
        var serverDate = r[1];
        var date = extractDate(tags, serverDate);

        if (tags && tags.title) titleEl.textContent = tags.title;
        if (tags) {
          var composer = tags.composer || '';
          var artist = tags.artist || '';
          var sub = '';
          if (composer && artist && composer !== artist) {
            sub = composer + ' \u00b7 ' + artist;
          } else {
            sub = composer || artist || '';
          }
          if (tags.album) sub += (sub ? ' \u00b7 ' : '') + tags.album;
          if (sub && subEl) subEl.textContent = sub;
        }
        if (date && dateEl) dateEl.textContent = fmtDay(date);
      }).catch(function(err) {
        console.warn('[music] enrichment failed for', filename, err);
      });
    });
  }

  try {
    renderImmediate();
    enrichAsync();
  } catch (err) {
    container.innerHTML = '<div class="music-loading" style="color:#c44;">Error rendering tracks: ' + (err && err.message ? err.message : err) + '. Check the browser console for details.</div>';
    console.error('[music] renderTracks failed:', err);
  }
}

// Handle both cases: DOMContentLoaded already fired, or hasn't yet
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderTracks);
} else {
  renderTracks();
}
</script>
