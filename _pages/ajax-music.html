<script>
// ──────────────────────────────────────────────
// TRACK MANIFEST
// Add or remove filenames here. The page reads
// ID3 title, artist/composer from each file's
// metadata, and picks up the date from the
// server's Last-Modified header (which reflects
// when the file was last committed/deployed).
// ──────────────────────────────────────────────
var SONGS = [
  'Cartesian.mp3',
  'Elysium.mp3',
  'Meridian.mp3',
  'Parallax.mp3',
  'Reversal.mp3'
];
var PIANO = [
  'Piano_Improvisation_1.mp3',
  'Piano_Improvisation_2.mp3'
];
var BASE_PATH = '/ajax/files/Songs/';

function readTags(url) {
  return new Promise(function(resolve) {
    if (typeof jsmediatags === 'undefined') {
      resolve(null);
      return;
    }
    jsmediatags.read(url, {
      onSuccess: function(tag) { resolve(tag.tags || null); },
      onError: function() { resolve(null); }
    });
  });
}

function fetchDate(url) {
  return fetch(url, { method: 'HEAD' })
    .then(function(res) {
      var lm = res.headers.get('last-modified');
      return lm ? new Date(lm) : null;
    })
    .catch(function() { return null; });
}

function fallbackName(filename) {
  return filename
    .replace(/\.[^.]+$/, '')
    .replace(/_/g, ' ')
    .replace(/(\d+)$/, ' $1');
}

function formatDate(d) {
  if (!d || isNaN(d.getTime())) return '';
  var months = ['Jan','Feb','Mar','Apr','May','Jun',
                'Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}

function buildTrack(num, url, filename, tags, fileDate) {
  var title = (tags && tags.title) ? tags.title : fallbackName(filename);

  // Try composer first, then artist, then TPE2 (band/album artist)
  var composer = '';
  if (tags) {
    composer = tags.composer || tags.artist || '';
    if (!composer && tags.TPE2) composer = tags.TPE2.data || '';
  }

  var dateStr = formatDate(fileDate);

  var el = document.createElement('div');
  el.className = 'track';
  el.innerHTML =
    '<span class="track-num">' + num + '</span>' +
    '<div class="track-info">' +
      '<div class="track-title">' + title + '</div>' +
      (composer ? '<div class="track-composer">' + composer + '</div>' : '') +
      (dateStr ? '<div class="track-date">' + dateStr + '</div>' : '') +
      '<audio controls preload="none">' +
        '<source src="' + url + '" type="audio/mpeg">' +
      '</audio>' +
    '</div>';
  return el;
}

function loadSection(files, containerId) {
  var container = document.getElementById(containerId);
  if (!container) return;

  var promises = files.map(function(filename, i) {
    var url = BASE_PATH + filename;
    return Promise.all([readTags(url), fetchDate(url)])
      .then(function(results) {
        return {
          num: i + 1,
          url: url,
          filename: filename,
          tags: results[0],
          date: results[1]
        };
      });
  });

  Promise.all(promises).then(function(tracks) {
    container.innerHTML = '';
    if (tracks.length === 0) {
      container.innerHTML = '<div class="track-loading">No tracks found.</div>';
      return;
    }
    tracks.forEach(function(t) {
      container.appendChild(
        buildTrack(t.num, t.url, t.filename, t.tags, t.date)
      );
    });
  });
}

document.addEventListener('DOMContentLoaded', function() {
  loadSection(SONGS, 'song-list');
  loadSection(PIANO, 'piano-list');
});
</script>
