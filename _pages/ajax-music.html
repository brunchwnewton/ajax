<script>
// ──────────────────────────────────────────────
// TRACK MANIFEST
// Add or remove filenames here. Everything else
// (title, composer, date, ordering) is automatic.
// ──────────────────────────────────────────────
var BASE = '/ajax/files/songs/';

var FILES = [
  'Dark Flames\' Theme Song.mp3',
  'Dark Flames - Orchestral.mp3',
  'Dark Flames By Choir.mp3',
  'Dark Orchestra.mp3',
  'Dirty Chicago Theme.mp3',
  'Evolution in A Minor.mp3',
  'Fire and Ice.mp3',
  'Free Olympia Orchestral.mp3',
  'Hilltops in A Minor.mp3',
  'Huma.mp3',
  'Miracle Theme Orchestral.mp3',
  'Reverb.mp3',
  'Rocky Song 1.mp3',
  'Sords Theme Song.mp3',
  'The Eta Miracle.mp3',
  'The Way Things Go.mp3',
  'Song 1.mp3',
  'Song 2 - Loop.mp3',
  'Song 3 Orchestral.mp3',
  'Song 4 Orchestral.mp3',
  'Song 5.mp3',
  'Song 7.mp3',
  'Song 8 - Reverby.mp3',
  'Song 9 Orchestral - Extra Reverby.mp3',
  'Song 10 Orchestral.mp3',
  'Song 11.mp3',
  'Song 12 Orchestral.mp3',
  'Song 13.mp3',
  'Song 14 Orchestral.mp3',
  'Song 15.mp3',
  'Song 16.mp3',
  'Song 17.mp3',
  'Song 18.mp3',
  'Song 20 Orchestral.mp3',
  'Song 21.mp3',
  'Song 22.mp3',
  'Song 23.mp3',
  'Song 24.mp3',
  'BG Music 1.mp3',
  'BG Music 1 - TCDS Effect.mp3',
  'BG Music 1 - Underwater Muffle.mp3',
  'Trailer End 2.mp3'
];

var MONTHS = ['January','February','March','April','May','June',
              'July','August','September','October','November','December'];

function readTags(url) {
  return new Promise(function(resolve) {
    if (typeof jsmediatags === 'undefined') { resolve(null); return; }
    jsmediatags.read(url, {
      onSuccess: function(tag) { resolve(tag.tags || null); },
      onError: function() { resolve(null); }
    });
  });
}

function fetchDate(url) {
  return fetch(url, { method: 'HEAD' })
    .then(function(res) {
      var lm = res.headers.get('last-modified');
      return lm ? new Date(lm) : null;
    })
    .catch(function() { return null; });
}

function extractDate(tags, serverDate) {
  // Try ID3 date fields first
  if (tags) {
    // TDRC = recording date (ID3v2.4), TYER = year (ID3v2.3)
    var tdrc = tags.TDRC && tags.TDRC.data;
    if (tdrc) {
      var d = new Date(tdrc);
      if (!isNaN(d.getTime())) return d;
    }
    if (tags.year) {
      var y = parseInt(tags.year);
      if (!isNaN(y)) return new Date(y, 0, 1);
    }
  }
  return serverDate;
}

function prettify(filename) {
  return filename.replace(/\.[^.]+$/, '').replace(/_/g, ' ');
}

function fmtDay(d) {
  if (!d || isNaN(d.getTime())) return '';
  return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}

function monthKey(d) {
  if (!d || isNaN(d.getTime())) return 'Unknown Date';
  return MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}

function buildTrack(num, url, filename, tags, date) {
  var title = (tags && tags.title) ? tags.title : prettify(filename);
  var sub = '';
  if (tags) {
    var composer = tags.composer || '';
    var artist = tags.artist || '';
    if (composer && artist && composer !== artist) {
      sub = composer + ' \u00b7 ' + artist;
    } else {
      sub = composer || artist || '';
    }
    if (tags.album) sub += (sub ? ' \u00b7 ' : '') + tags.album;
  }
  var ds = fmtDay(date);

  var ext = filename.split('.').pop().toLowerCase();
  var mime = ext === 'wav' ? 'audio/wav' : 'audio/mpeg';

  var el = document.createElement('div');
  el.className = 'track';
  el.innerHTML =
    '<span class="track-num">' + num + '</span>' +
    '<div class="track-info">' +
      '<div class="track-title">' + title + '</div>' +
      (sub ? '<div class="track-sub">' + sub + '</div>' : '') +
      (ds ? '<div class="track-date">' + ds + '</div>' : '') +
      '<audio controls preload="none">' +
        '<source src="' + url + '" type="' + mime + '">' +
      '</audio>' +
    '</div>';
  return el;
}

document.addEventListener('DOMContentLoaded', function() {
  var container = document.getElementById('track-container');

  var promises = FILES.map(function(filename) {
    var url = BASE + encodeURIComponent(filename);
    return Promise.all([readTags(url), fetchDate(url)])
      .then(function(r) {
        var date = extractDate(r[0], r[1]);
        return { url: url, filename: filename, tags: r[0], date: date };
      })
      .catch(function() {
        return { url: url, filename: filename, tags: null, date: null };
      });
  });

  Promise.all(promises).then(function(tracks) {
    // Sort newest first; undated tracks go to the end
    tracks.sort(function(a, b) {
      if (!a.date && !b.date) return 0;
      if (!a.date) return 1;
      if (!b.date) return -1;
      return b.date.getTime() - a.date.getTime();
    });

    container.innerHTML = '';

    // Count
    var countEl = document.createElement('div');
    countEl.className = 'track-count';
    countEl.textContent = tracks.length + ' tracks';
    container.appendChild(countEl);

    // Group by month/year
    var currentMonth = '';
    var num = 0;
    tracks.forEach(function(t) {
      var mk = monthKey(t.date);
      if (mk !== currentMonth) {
        currentMonth = mk;
        var h = document.createElement('div');
        h.className = 'month-header';
        h.textContent = mk;
        container.appendChild(h);
        num = 0;
      }
      num++;
      container.appendChild(buildTrack(num, t.url, t.filename, t.tags, t.date));
    });
  });
});
</script>
